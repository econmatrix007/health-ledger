name: Release ZIP
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIP
        run: |
          mkdir -p dist/health-ledger
          cp -R app docs README.md LICENSE DISCLAIMER.md PRIVACY.md dist/health-ledger/
          cd dist && zip -r "health-ledger-${GITHUB_REF_NAME}.zip" health-ledger
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/health-ledger-${GITHUB_REF_NAME}.zip" --title "Daily Health Ledger $GITHUB_REF_NAME" --notes-file CHANGELOG.md
